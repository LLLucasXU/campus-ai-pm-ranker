[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-job-ranker"
version = "1.0.0"
description = "Deterministic intra-company ranking for campus AI product jobs"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
campus-job-ranker = "campus_job_ranker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
